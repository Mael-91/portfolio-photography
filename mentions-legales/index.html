<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Mentions légales | Mael Constantin</title>
    <meta
      name="description"
      content="Mentions légales du site maelconstantin.fr — Mael Constantin, photographe automobile freelance."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://maelconstantin.fr/mentions-legales/" />

    <!-- Reprend ton design global -->
    <link rel="stylesheet" href="/styles.css" />

    <style>
      /* Mise en forme locale (sans toucher à ton styles.css) */
      .legal {
        background: #ffffff;
        padding: 80px clamp(24px, 4vw, 80px);
      }
      .legal__wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      .legal__title {
        margin: 0 0 18px 0;
        color: var(--title-color);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: clamp(22px, 2.8vw, 36px);
      }
      .legal__meta {
        margin: 0 0 34px 0;
        color: var(--text-color);
        line-height: 1.6;
        font-size: 15px;
      }
      .legal h2 {
        margin: 40px 0 12px 0;
        color: var(--title-color);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 14px;
      }
      .legal p,
      .legal li {
        color: var(--text-color);
        font-size: 15px;
        line-height: 1.75;
      }
      .legal ul {
        margin: 10px 0 0 0;
        padding-left: 18px;
      }
      .legal a {
        color: var(--title-color);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .legal__back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 13px;
        color: var(--title-color);
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid rgba(42, 36, 27, 0.18);
        font-size: 12px;
        letter-spacing: 0.03em;
        color: var(--text-color);
        vertical-align: middle;
      }
    </style>
  </head>

  <body data-document-type="legal_notice">
    <main class="legal" aria-label="Mentions légales">
      <div class="legal__wrap">
        <h1 class="legal__title">Mentions légales</h1>

        <p class="legal__meta">
          Dernière mise à jour : <strong id="legalDate">17 février 2026</strong><br />
          Site : <strong>https://maelconstantin.fr</strong>
        </p>
        <article id="legalContent"></article>
        <a class="legal__back" href="/">← Retour au site</a>
      </div>
    </main>
    <div id="site-footer" class="footer-slot" aria-hidden="true"></div>

    <script src="../main.js" defer></script>
  </body>
</html>
